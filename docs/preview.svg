<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" fill="none" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect width="900" height="580" fill="#f7f8fa"/>
  <text x="60" y="30" fill="#9aa0a6" font-size="12">审批弹窗 + 解释按钮（示意图 / illustration）</text>

  <!-- approval card -->
  <rect x="60" y="46" width="780" height="152" rx="14" fill="#ffffff" stroke="#f0d9a8"/>
  <path d="M60 60a14 14 0 0 1 14-14h752a14 14 0 0 1 14 14v22H60V60Z" fill="#fdf3e3"/>
  <circle cx="84" cy="65" r="5" fill="#e2a33a"/>
  <text x="96" y="70" fill="#a06400" font-size="13">等待审批</text>

  <text x="84" y="112" fill="#1a1a1a" font-size="15" font-weight="600">工具 Shell 请求执行一个需要你同意的操作</text>
  <text x="84" y="140" fill="#6b6b6b" font-size="12.5" font-family="Consolas,'Cascadia Mono',monospace">find /c/Users/you/AppData/Roaming/SomeApp -maxdepth 4 -type f -printf "%s\n" | sort -rn | head</text>

  <rect x="614" y="156" width="76" height="32" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
  <text x="652" y="177" fill="#1a1a1a" font-size="13" text-anchor="middle">拒绝</text>
  <rect x="700" y="156" width="112" height="32" rx="8" fill="#e5484d"/>
  <text x="756" y="177" fill="#ffffff" font-size="13" text-anchor="middle">允许一次</text>

  <!-- explain button -->
  <rect x="60" y="216" width="152" height="30" rx="8" fill="#ffffff" stroke="#e0e0e0"/>
  <circle cx="80" cy="231" r="7" stroke="#6b6b6b" stroke-width="1.2"/>
  <text x="80" y="235" fill="#6b6b6b" font-size="9" text-anchor="middle">?</text>
  <text x="96" y="236" fill="#5c5c5c" font-size="12.5">解释这条操作</text>

  <!-- explanation panel -->
  <rect x="60" y="262" width="780" height="276" rx="12" fill="#ffffff" stroke="#e8e8e8"/>
  <circle cx="86" cy="294" r="7" stroke="#c27c0e" stroke-width="1.2"/>
  <text x="86" y="298" fill="#c27c0e" font-size="9" text-anchor="middle">?</text>
  <text x="102" y="299" fill="#1a1a1a" font-size="14.5" font-weight="600">在找一个软件的数据文件夹有多大</text>

  <g fill="#5c5c5c" font-size="13">
    <circle cx="88" cy="332" r="2.5" fill="#b0b0b0"/>
    <text x="100" y="337">会在某个软件保存数据的地方，往下找 4 层文件</text>
    <circle cx="88" cy="362" r="2.5" fill="#b0b0b0"/>
    <text x="100" y="367">只统计文件大小并排序，不会打开看内容</text>
    <circle cx="88" cy="392" r="2.5" fill="#b0b0b0"/>
    <text x="100" y="397">不会修改、删除或新建任何东西</text>
    <circle cx="88" cy="422" r="2.5" fill="#b0b0b0"/>
    <text x="100" y="427">可能看到聊天缓存、数据库这类隐私文件的名字</text>
  </g>

  <path d="M84 468h732" stroke="#ececec" stroke-dasharray="4 4"/>
  <rect x="84" y="486" width="72" height="24" rx="12" fill="#f1f8f3"/>
  <text x="120" y="502" fill="#12924f" font-size="12" text-anchor="middle">风险：低</text>
  <text x="172" y="503" fill="#1a1a1a" font-size="13" font-weight="600">建议允许</text>
  <text x="248" y="503" fill="#8a8a8a" font-size="12">只是看看谁占地方，不动任何东西</text>

  <text x="60" y="566" fill="#9aa0a6" font-size="11.5">解释内容由当前会话使用的模型生成；按钮只有点击时才会调用模型。</text>
</svg>
